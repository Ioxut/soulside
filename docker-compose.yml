services:
  db:
    image: pgvector/pgvector:pg16
    container_name: soulside-db
    environment:
      POSTGRES_USER: soulside
      POSTGRES_PASSWORD: soulside
      POSTGRES_DB: soulside
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    restart: unless-stopped

volumes:
  pgdata:
